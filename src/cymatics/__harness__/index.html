<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Plate lab</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        font:
          12px/1.45 ui-monospace,
          Menlo,
          monospace;
        background: oklch(0.19 0.014 150);
        color: #ddd;
      }
      #root {
        display: flex;
        gap: 24px;
        padding: 16px;
        align-items: flex-start;
      }
      .panel {
        width: 300px;
        flex: none;
        overflow: hidden;
        display: grid;
        gap: 6px;
      }
      .panel fieldset {
        border: 1px solid #ffffff22;
        border-radius: 6px;
        display: grid;
        gap: 4px;
        padding: 8px;
        margin: 0;
      }
      .panel legend {
        color: #999;
      }
      .panel label {
        display: grid;
        grid-template-columns: 74px 1fr 64px;
        gap: 6px;
        align-items: center;
      }
      .panel label.check {
        grid-template-columns: auto 1fr;
      }
      .panel output {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      button,
      select {
        font: inherit;
      }
      pre {
        margin: 0;
        white-space: pre-wrap;
        color: #aaa;
      }
      .stage {
        position: relative;
        flex: none;
        overflow: clip;
        border-radius: 50%;
        background: oklch(0.13 0.004 150);
        box-shadow:
          0 40px 80px -24px oklch(0 0 0 / 0.7),
          0 12px 24px -12px oklch(0 0 0 / 0.5);
        transition: border-radius 420ms cubic-bezier(0.77, 0, 0.175, 1);
      }
      .stage[data-shape='square'] {
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>

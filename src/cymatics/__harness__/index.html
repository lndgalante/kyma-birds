<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Plate lab</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        font:
          12px/1.45 ui-monospace,
          Menlo,
          monospace;
        background: oklch(0.19 0.014 150);
        color: #ddd;
      }
      #root {
        display: flex;
        gap: 24px;
        padding: 16px;
        align-items: flex-start;
      }
      .panel {
        width: 300px;
        flex: none;
        overflow: hidden;
        display: grid;
        gap: 6px;
      }
      .panel fieldset {
        border: 1px solid #ffffff22;
        border-radius: 6px;
        display: grid;
        gap: 4px;
        padding: 8px;
        margin: 0;
      }
      .panel legend {
        color: #999;
      }
      .panel label {
        display: grid;
        grid-template-columns: 74px 1fr 64px;
        gap: 6px;
        align-items: center;
      }
      .panel label.check {
        grid-template-columns: auto 1fr;
      }
      .panel output {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      button,
      select {
        font: inherit;
      }
      pre {
        margin: 0;
        white-space: pre-wrap;
        color: #aaa;
      }
      /* The app's plate-disc (app.css): the page paints the circle's shade and stone rim; the
         canvas draws the sand, and the square's own surface. */
      .stage {
        position: relative;
        flex: none;
        overflow: clip;
        border-radius: 50%;
        background: radial-gradient(
          closest-side,
          oklch(0 0 0 / 0.3),
          oklch(0 0 0 / 0.42) calc(96.618% - 0.5px),
          oklch(0.54 0.008 85) calc(96.618% + 0.5px),
          oklch(0.54 0.008 85) calc(96.618% + max(1.063%, 1.5px) - 0.5px),
          transparent calc(96.618% + max(1.063%, 1.5px) + 0.5px)
        );
        box-shadow: 0 10px 28px -14px oklch(0 0 0 / 0.55);
        transition: border-radius 420ms cubic-bezier(0.77, 0, 0.175, 1);
      }
      .stage[data-shape='square'] {
        border-radius: 6px;
        background: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
